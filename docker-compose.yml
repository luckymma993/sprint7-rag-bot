services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/${LLM_MODEL_FILE:-Qwen3-1.7B-Q8_0.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "4096"
      - "-t"
      - "6"
      - "--parallel"
      - "1"
    volumes:
      - ./.local-model/weights:/models:ro

  bot:
    build: .
    depends_on:
      llm:
        condition: service_healthy
    environment:
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: ${LLM_MODEL_FILE:-Qwen3-1.7B-Q8_0.gguf}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  hf-cache:
